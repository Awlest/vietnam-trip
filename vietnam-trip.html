<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vietnam 14j">

<title>Vietnam 14j • 17-31 août</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#020617;--bg2:#0f172a;--card:#1e293b;--card2:#334155;
  --border:#334155;--border2:#475569;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --emerald:#34d399;--amber:#fbbf24;--orange:#fb923c;
  --blue:#60a5fa;--rose:#fb7185;--purple:#c084fc;
  --green:#22c55e;--yellow:#eab308;--pink:#ec4899;
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;overscroll-behavior:none}
body{padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#020617 0%,#0f172a 100%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue);text-decoration:none}

/* Header */
.header{position:sticky;top:0;z-index:30;background:rgba(2,6,23,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.header-top{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.header-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-date{font-size:10px;color:var(--text3);margin-top:2px}
.header-stats{text-align:right}
.header-counter{font-size:12px;font-family:monospace;color:var(--emerald);font-weight:600}
.header-label{font-size:9px;color:var(--text3)}
.progress-bar{height:3px;background:var(--card);margin:0 16px;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--emerald),var(--amber));transition:width .5s ease}

/* Day tabs */
.tabs{overflow-x:auto;padding:8px 12px 10px;display:flex;gap:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;background:var(--card);color:var(--text2);transition:all .2s;white-space:nowrap;border:1px solid transparent}
.tab.done{background:rgba(16,185,129,.12);color:var(--emerald);border-color:rgba(16,185,129,.3)}
.tab.active{background:var(--amber);color:#020617;box-shadow:0 4px 12px rgba(251,191,36,.3)}
.tab-count{font-size:9px;opacity:.7;margin-left:4px;font-weight:500}

/* Content */
.content{padding:16px 16px 80px}
.day-header{padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.day-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.day-city{font-size:20px;font-weight:700;color:var(--text)}
.day-date{font-size:12px;color:var(--text3)}
.day-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2)}
.transport{margin-top:10px;padding:8px 12px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:8px;font-size:11px;color:#93c5fd;display:flex;align-items:center;gap:6px}

/* Sections */
.section{margin-bottom:22px}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 4px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.section-icon{font-size:14px}
.activities .section-title{color:var(--emerald)}
.food .section-title{color:var(--orange)}
.shopping .section-title{color:var(--amber)}
.hotel .section-title{color:var(--blue)}
.bonus .section-title{color:var(--purple)}

/* Items */
.items{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;transition:all .2s}
.item.done{opacity:.55;background:rgba(30,41,59,.5)}
.item-row{display:flex;gap:10px;align-items:flex-start}
.checkbox{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:all .2s;margin-top:1px;background:transparent}
.checkbox.done{background:var(--emerald);border-color:var(--emerald);color:#020617}
.item-body{flex:1;min-width:0}
.item-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:4px;flex-wrap:wrap}
.item-title{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35;flex:1;min-width:0}
.item.done .item-title{text-decoration:line-through;color:var(--text3)}
.item-tags{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.tag{font-size:9.5px;padding:2px 6px;border-radius:8px;font-weight:600;border:1px solid transparent;letter-spacing:.02em}

/* Intensity tags */
.tag-chill{background:rgba(16,185,129,.15);color:#6ee7b7;border-color:rgba(16,185,129,.3)}
.tag-moderate{background:rgba(245,158,11,.15);color:#fcd34d;border-color:rgba(245,158,11,.3)}
.tag-active{background:rgba(249,115,22,.15);color:#fdba74;border-color:rgba(249,115,22,.3)}
.tag-sport{background:rgba(244,63,94,.15);color:#fda4af;border-color:rgba(244,63,94,.3)}

/* Shopping tags */
.tag-watch-new{background:rgba(59,130,246,.18);color:#93c5fd}
.tag-watch-vintage{background:rgba(168,85,247,.18);color:#d8b4fe}
.tag-gold{background:rgba(234,179,8,.18);color:#fde047}
.tag-silver{background:rgba(100,116,139,.25);color:#cbd5e1}
.tag-custom{background:rgba(236,72,153,.18);color:#f9a8d4}
.tag-pearl{background:rgba(6,182,212,.18);color:#67e8f9}
.tag-silk{background:rgba(217,70,239,.18);color:#f0abfc}
.tag-bazar{background:rgba(20,184,166,.18);color:#5eead4}
.tag-craft{background:rgba(132,204,22,.18);color:#bef264}
.tag-food-shop{background:rgba(249,115,22,.18);color:#fdba74}
.tag-textile{background:rgba(99,102,241,.18);color:#a5b4fc}
.tag-ethnic{background:rgba(132,204,22,.2);color:#bef264}

/* Bonus tags */
.tag-food{background:rgba(249,115,22,.15);color:#fdba74}
.tag-location{background:rgba(59,130,246,.15);color:#93c5fd}
.tag-must{background:rgba(244,63,94,.15);color:#fda4af}
.tag-hidden{background:rgba(168,85,247,.15);color:#d8b4fe}
.tag-unique{background:rgba(236,72,153,.15);color:#f9a8d4}

/* Halal */
.tag-halal{background:rgba(34,197,94,.2);color:#86efac;border-color:rgba(34,197,94,.4)}
.tag-halal-option{background:rgba(245,158,11,.2);color:#fcd34d;border-color:rgba(245,158,11,.4)}
.tag-no-halal{background:rgba(244,63,94,.2);color:#fda4af;border-color:rgba(244,63,94,.4)}

.item-desc{font-size:11.5px;color:var(--text2);line-height:1.55;margin-bottom:8px}
.item-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.maps-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--blue);font-weight:500;padding:3px 0}
.maps-link:active{color:#3b82f6}
.item-price{font-size:11px;color:var(--amber);font-weight:600;font-family:monospace}

/* Bonus items - smaller, denser */
.bonus .item{padding:10px 12px;background:rgba(168,85,247,.05);border-color:rgba(168,85,247,.15)}
.bonus .item-title{font-size:13px}
.bonus .item-desc{font-size:11px;margin-bottom:6px}

/* Legend */
.legend{margin-top:20px;padding:14px;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.legend-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:700;margin-bottom:10px}
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.legend-grid .tag{text-align:center;padding:5px 8px;border-radius:6px}

/* Reset button */
.reset-btn{position:fixed;bottom:20px;right:16px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--text2);box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:20;display:flex;align-items:center;gap:6px;font-weight:500}
.reset-btn:active{background:var(--card2)}

/* Tip box */
.tip-box{margin-top:16px;padding:10px 12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:8px;font-size:11px;color:#fcd34d;line-height:1.5}
.tip-box strong{color:var(--amber)}

@media (min-width:640px){
  body{font-size:15px}
  .content{padding:20px 24px 80px}
  .day-city{font-size:24px}
}
</style>
</head>

    hotel: { name: "Essence Hanoi Hotel & Spa", price: "~50€/nuit", address: "22 Ta Hien, Hoan Kiem, Hanoi" },
    activities: [
      { intensity: "chill", title: "Temple de la Littérature", desc: "Première université du Vietnam (1070). Cours intérieures paisibles. 1h sur place.", address: "Temple of Literature, Hanoi", price: "30k VND" }
    ],

      { halal: true, title: "Tamarind Café", desc: "Dîner végétarien excellent dernier soir. Cuisine fusion saine. Halal-friendly intégral.", address: "Tamarind Café 80 Ma May, Hanoi", price: "~10€" }
    ],
    shopping: [
      { type: "silver", title: "Rue Hang Bac - dernière chasse argenterie", desc: "Si pas eu le temps J1. Pièces uniques filigrane. Dernière opportunité.", address: "Hang Bac street, Hanoi" },
      { type: "silk", title: "Rue Hang Gai - soie + Tan My Design", desc: "Foulards, peintures sur soie, sacs. Tan My Design = la référence haut de gamme.", address: "Tan My Design 66 Hang Gai, Hanoi" },
      { type: "textile", title: "Marie-Linh Boutique", desc: "Designer franco-vietnamienne, vêtements féminins contemporains. Coupes parfaites, lin et coton. Plusieurs adresses Hanoi.", address: "Marie-Linh 11 Nha Tho, Hanoi", price: "40-150€" },
      { type: "textile", title: "Things of Substance", desc: "Boutique multimarques sélection rigoureuse. Créateurs vietnamiens contemporains. Womenswear de qualité.", address: "Things of Substance 5 Nha Tho, Hanoi", price: "30-120€" },

    ],
    bonus: [
      { type: "must", title: "Hoa Lo Prison Museum", desc: "Ancienne prison coloniale + camp pilotes US (le 'Hanoi Hilton'). Bouleversant. 1h-2h.", address: "Hoa Lo Prison Museum, Hanoi", price: "30k VND" },

      { type: "food", title: "Quan An Ngon", desc: "Restaurant cuisine régionale viet, large choix dans cour à l'ancienne. Halal-friendly possible.", address: "Quan An Ngon 18 Phan Boi Chau, Hanoi", price: "~12€" },
      { type: "hidden", title: "Bao Khanh street - cafés alley", desc: "Petite ruelle parallèle au lac Hoan Kiem, pleine de cafés cachés, ambiance cool, peu touristique.", address: "Bao Khanh street, Hanoi" },
      { type: "unique", title: "Massage traditionnel La Belle Spa", desc: "Massage 90 min final pour décompresser avant vol. Excellente réputation, propre, raisonnable.", address: "La Belle Spa Hanoi", price: "~20€/90min" }

const INTENSITY = {
  chill: { icon: "🛋️", label: "Chill" },
  moderate: { icon: "🚶", label: "Modéré" },
  active: { icon: "🚴", label: "Actif" },
  sport: { icon: "⛰️", label: "Sportif" }
};

const SHOP_LABELS = {
  "watch-new": "Montre neuve", "watch-vintage": "Montre vintage",
  "gold": "Or", "silver": "Argenterie",
  "custom": "Sur-mesure", "pearl": "Perles", "silk": "Soie/Tailleur",
  "bazar": "Bazar local", "craft": "Artisanat", "food-shop": "Spécialité",
  "textile": "Textile/Mode", "ethnic": "Ethnique"
};

const BONUS_LABELS = {
  food: "🍴 Food", location: "📍 Lieu", must: "⭐ Must-see",
  hidden: "💎 Caché", unique: "✨ Unique"
};

const HALAL_LABELS = {
  true: { label: "HALAL ✓", cls: "tag-halal" },
  option: { label: "DEMANDER", cls: "tag-halal-option" }
};

// State
let state = {
  activeDay: 1,
  checked: {}
};

try {
  const saved = localStorage.getItem("vn-trip-2026");
  if (saved) state.checked = JSON.parse(saved);
} catch(e) {}

function save() {
  try { localStorage.setItem("vn-trip-2026", JSON.stringify(state.checked)); } catch(e) {}
}

function toggle(key) {
  state.checked[key] = !state.checked[key];
  save();
  render();
}

function setDay(d) {
  state.activeDay = d;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetProgress() {
  if (confirm("Réinitialiser tous les cochés ?")) {
    state.checked = {};
    save();
    render();
  }
}

window.toggle = toggle;
window.setDay = setDay;
window.resetProgress = resetProgress;

function mapsUrl(q) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

function escapeHtml(s) {
  if (!s) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function getAllItems(d) {
  const items = [];
  (d.activities||[]).forEach(x => items.push({...x, section:"activities"}));
  (d.food||[]).forEach(x => items.push({...x, section:"food"}));
  (d.shopping||[]).forEach(x => items.push({...x, section:"shopping"}));
  if (d.hotel) items.push({...d.hotel, section:"hotel"});
  (d.bonus||[]).forEach(x => items.push({...x, section:"bonus"}));
  return items;
}

function dayStats(d) {
  const items = getAllItems(d);
  let done = 0;
  items.forEach((_, i) => { if (state.checked[`d${d.day}-${i}`]) done++; });
  return { done, total: items.length };
}

function totalStats() {
  let done = 0, total = 0;
  TRIP.forEach(d => { const s = dayStats(d); done += s.done; total += s.total; });
  return { done, total, pct: total ? (done/total*100) : 0 };
}

function renderItem(item, key, sectionKind) {
  const done = state.checked[key];
  const tags = [];

  if (item.intensity) {
    const i = INTENSITY[item.intensity];
    tags.push(`<span class="tag tag-${item.intensity}">${i.icon} ${i.label}</span>`);
  }
  if (item.type && SHOP_LABELS[item.type]) {
    tags.push(`<span class="tag tag-${item.type}">${SHOP_LABELS[item.type]}</span>`);
  }
  if (sectionKind === "bonus" && item.type && BONUS_LABELS[item.type]) {
    tags.push(`<span class="tag tag-${item.type}">${BONUS_LABELS[item.type]}</span>`);
  }
  if (item.halal !== undefined && HALAL_LABELS[item.halal]) {
    const h = HALAL_LABELS[item.halal];
    tags.push(`<span class="tag ${h.cls}">${h.label}</span>`);
  }

  const tagsHtml = tags.length ? `<div class="item-tags">${tags.join("")}</div>` : "";
  const descHtml = item.desc ? `<p class="item-desc">${escapeHtml(item.desc)}</p>` : "";
  const priceHtml = item.price ? `<span class="item-price">${escapeHtml(item.price)}</span>` : "";
  const mapsHtml = item.address ? `<a class="maps-link" href="${mapsUrl(item.address)}" target="_blank" rel="noopener">📍 Maps</a>` : "";

  return `
    <div class="item ${done?"done":""}">
      <div class="item-row">
        <button class="checkbox ${done?"done":""}" onclick="toggle('${key}')" aria-label="Cocher">${done?"✓":""}</button>
        <div class="item-body">
          <div class="item-head">
            <div class="item-title">${escapeHtml(item.title||item.name)}</div>
            ${tagsHtml}
          </div>
          ${descHtml}
          <div class="item-footer">${mapsHtml}${priceHtml}</div>
        </div>
      </div>
    </div>
  `;
}

function render() {
  const day = TRIP.find(d => d.day === state.activeDay);
  const stats = totalStats();

  let html = `
    <div class="header">
      <div class="header-top">
        <div>
          <div class="header-title">🇻🇳 Vietnam 14j</div>
          <div class="header-date">17 août → 31 août 2026 · couple</div>
        </div>
        <div class="header-stats">
          <div class="header-counter">${stats.done}/${stats.total}</div>
          <div class="header-label">complétés</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${stats.pct}%"></div></div>
      <div class="tabs">
        ${TRIP.map(d => {
          const ds = dayStats(d);
          const cls = d.day === state.activeDay ? "active" : (ds.total > 0 && ds.done === ds.total ? "done" : "");
          return `<button class="tab ${cls}" onclick="setDay(${d.day})">J${d.day}<span class="tab-count">${ds.done}/${ds.total}</span></button>`;
        }).join("")}
      </div>
    </div>
    <div class="content">
      <div class="day-header">
        <div class="day-title">
          <div class="day-city">${escapeHtml(day.city)}</div>
          <div class="day-date">${escapeHtml(day.date)}</div>
        </div>
        <div class="day-meta">☁️ ${escapeHtml(day.weather)}</div>
        ${day.transport ? `<div class="transport">${day.transport.icon} ${escapeHtml(day.transport.text)}</div>` : ""}
      </div>
  `;

  let idx = 0;
  const sections = [
    { key: "activities", title: "Activités", icon: "🎯", items: day.activities || [] },
    { key: "food", title: "Nourriture & Restos", icon: "🍜", items: day.food || [] },
    { key: "shopping", title: "Shopping", icon: "🛍️", items: day.shopping || [] },
    { key: "hotel", title: "Hébergement", icon: "🏨", items: day.hotel ? [day.hotel] : [] },
    { key: "bonus", title: "✨ Bonus secrets", icon: "💎", items: day.bonus || [] }
  ];

  sections.forEach(s => {
    if (s.items.length === 0) return;
    html += `<div class="section ${s.key}">
      <div class="section-header">
        <span class="section-icon">${s.icon}</span>
        <span class="section-title">${s.title}</span>
      </div>
      <div class="items">`;
    s.items.forEach(it => {
      const k = `d${day.day}-${idx++}`;
      html += renderItem(it, k, s.key);
    });
    html += `</div></div>`;
  });

  if (state.activeDay === 1) {
    html += `
      <div class="legend">
        <div class="legend-title">Légende intensité</div>
        <div class="legend-grid">
          <span class="tag tag-chill">🛋️ Chill</span>
          <span class="tag tag-moderate">🚶 Modéré</span>
          <span class="tag tag-active">🚴 Actif</span>
          <span class="tag tag-sport">⛰️ Sportif</span>
        </div>
      </div>
      <div class="tip-box">
        <strong>💡 Astuce :</strong> Ajoutez cette page à votre écran d'accueil (Partager → Sur l'écran d'accueil sur iOS, ou ⋮ → Ajouter à l'écran sur Android). Fonctionne 100% offline. Vos cochés sont sauvegardés.
      </div>
    `;
  }

  html += `</div>`;

  document.getElementById("app").innerHTML = html;
}

render();
</script>
</body>
</html>
