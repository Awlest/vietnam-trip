<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vietnam 13j">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23DA251D'/%3E%3Cpolygon fill='%23FFFF00' points='50,15 60,42 88,42 65,58 75,85 50,68 25,85 35,58 12,42 40,42'/%3E%3C/svg%3E">
<title>Vietnam 13j • 18-30 août 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#020617;--bg2:#0f172a;--card:#1e293b;--card2:#334155;
  --border:#334155;--border2:#475569;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --emerald:#34d399;--amber:#fbbf24;--orange:#fb923c;
  --blue:#60a5fa;--rose:#fb7185;--purple:#c084fc;
  --green:#22c55e;--yellow:#eab308;--pink:#ec4899;
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;overscroll-behavior:none}
body{padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#020617 0%,#0f172a 100%);background-attachment:fixed;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
details summary::-webkit-details-marker{display:none}
details summary{list-style:none}

/* Header */
.header{position:sticky;top:0;z-index:30;background:rgba(2,6,23,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.header-top{padding:10px 14px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.header-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.header-date{font-size:10px;color:var(--text3);margin-top:2px}
.header-stats{text-align:right;flex-shrink:0}
.header-counter{font-size:13px;font-family:ui-monospace,monospace;color:var(--emerald);font-weight:700}
.header-label{font-size:9px;color:var(--text3)}
.progress-bar{height:3px;background:var(--card);margin:0 14px;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--emerald),var(--amber));transition:width .5s ease}

/* Filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;min-height:32px;padding:6px 11px;border-radius:9px;font-size:11px;font-weight:600;background:var(--card);color:var(--text2);border:1px solid var(--border)}
.filter.on{background:rgba(96,165,250,.18);color:#bfdbfe;border-color:rgba(96,165,250,.45)}

/* Day tabs */
.tabs{overflow-x:auto;padding:8px 12px 10px;display:flex;gap:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:6px 11px;border-radius:10px;font-size:12px;font-weight:700;background:var(--card);color:var(--text2);transition:background .2s,color .2s;white-space:nowrap;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tab.done{background:rgba(16,185,129,.12);color:var(--emerald);border-color:rgba(16,185,129,.3)}
.tab.active{background:var(--amber);color:#020617;box-shadow:0 4px 12px rgba(251,191,36,.3)}
.tab.today::after{content:"";position:absolute}
.tab-code{font-size:8.5px;opacity:.75;font-weight:600;letter-spacing:.04em}
.tab-dot{width:5px;height:5px;border-radius:50%;background:var(--rose);display:inline-block;margin-left:3px;vertical-align:middle}

/* Content */
.content{padding:14px 14px 90px;max-width:760px;margin:0 auto}
.day-header{padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.day-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.day-city{font-size:20px;font-weight:700;color:var(--text);min-width:0;overflow-wrap:anywhere}
.day-date{font-size:12px;color:var(--text3);flex-shrink:0}
.day-line{font-size:12.5px;color:var(--text2);line-height:1.5;margin-top:2px}
.day-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text2);margin-top:8px;flex-wrap:wrap}
.transport{margin-top:10px;padding:8px 11px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:8px;font-size:11.5px;color:#93c5fd;display:flex;align-items:flex-start;gap:6px;line-height:1.5}

/* Intensity dots */
.intensity{display:inline-flex;align-items:center;gap:6px}
.dots{display:inline-flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border2)}
.dot.on{background:var(--emerald)}
.lv3 .dot.on{background:var(--amber)}
.lv4 .dot.on{background:var(--orange)}
.lv5 .dot.on{background:var(--rose)}
.intensity-label{font-size:10px;color:var(--text3);letter-spacing:.02em}

/* Alerts */
.alert{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:11.5px;line-height:1.5;border:1px solid}
.alert-warn{background:rgba(251,146,60,.09);border-color:rgba(251,146,60,.28);color:#fdba74}
.alert-peak{background:rgba(244,63,94,.09);border-color:rgba(244,63,94,.28);color:#fda4af}
.alert-train{background:rgba(192,132,252,.09);border-color:rgba(192,132,252,.28);color:#d8b4fe}
.alert-info{background:rgba(96,165,250,.09);border-color:rgba(96,165,250,.28);color:#93c5fd}

/* Sections */
.section{margin-bottom:20px}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--emerald)}
.section-icon{font-size:14px}
.section-count{font-size:10px;color:var(--text3);font-family:ui-monospace,monospace;margin-left:auto}

/* Items */
.items{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;transition:opacity .2s,background .2s}
.item.done{opacity:.55;background:rgba(30,41,59,.5)}
.item-row{display:flex;gap:2px;align-items:flex-start}
.check-hit{flex-shrink:0;min-width:44px;min-height:44px;display:flex;align-items:flex-start;justify-content:center;padding:11px 0 0 11px}
.checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:background .2s,border-color .2s;background:transparent}
.checkbox.done{background:var(--emerald);border-color:var(--emerald);color:#020617}
.item-body{flex:1;min-width:0;padding:12px 12px 12px 2px}
.item-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:4px;flex-wrap:wrap}
.item-title{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35;flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .item-title{text-decoration:line-through;color:var(--text3)}
.item-tags{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.tag{font-size:9.5px;padding:2px 6px;border-radius:8px;font-weight:600;border:1px solid transparent;letter-spacing:.02em;white-space:nowrap}
.tag-halal{background:rgba(34,197,94,.2);color:#86efac;border-color:rgba(34,197,94,.4)}
.tag-halal-option{background:rgba(245,158,11,.2);color:#fcd34d;border-color:rgba(245,158,11,.4)}
.tag-urgent{background:rgba(244,63,94,.2);color:#fda4af;border-color:rgba(244,63,94,.4)}
.tag-rain{background:rgba(96,165,250,.18);color:#93c5fd;border-color:rgba(96,165,250,.35)}
.item-desc{font-size:11.5px;color:var(--text2);line-height:1.55;margin-bottom:8px;overflow-wrap:anywhere}
.item-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.maps-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--blue);font-weight:500;min-height:32px;padding:4px 0}
.item-price{font-size:11px;color:var(--amber);font-weight:600;font-family:ui-monospace,monospace}

/* Schedule table */
.sched{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:2px}
.sched td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.sched td:first-child{color:var(--amber);font-family:ui-monospace,monospace;white-space:nowrap;width:1%;font-weight:600}
.sched tr:last-child td{border-bottom:none}
.sched .hi td{color:#fcd34d;font-weight:600}

/* Hotels */
.hotel-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.hotel-top{display:flex;gap:2px;align-items:flex-start}
.hotel-body{flex:1;min-width:0;padding:12px 12px 12px 2px}
.hotel-gamme{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.g-insta{color:var(--pink)}
.g-eco{color:var(--emerald)}
.g-secret{color:var(--purple)}
.g-budget{color:#5eead4}
.hotel-name{font-size:13.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.hotel-card.done{opacity:.6}
.hotel-card.done .hotel-name{text-decoration:line-through;color:var(--text3)}
.hotel-addr{font-size:10.5px;color:var(--text3);margin-top:2px;overflow-wrap:anywhere}
.hotel-why{font-size:11.5px;color:var(--text2);line-height:1.55;margin:7px 0}
.hotel-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hotel-price{font-size:11.5px;color:var(--amber);font-weight:700;font-family:ui-monospace,monospace}
.hotel-note{font-size:11px;line-height:1.5;padding:8px 10px;border-radius:8px;margin-bottom:8px}
.note-safe{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.22);color:#6ee7b7}
.note-avoid{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.22);color:#fda4af}
.note-warn{background:rgba(251,146,60,.09);border:1px solid rgba(251,146,60,.28);color:#fdba74}
.note-src{background:rgba(94,234,212,.07);border:1px solid rgba(94,234,212,.22);color:#5eead4}

/* Plans B */
.planb{margin-top:6px;padding:10px 12px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.22);border-radius:10px}
.planb-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--amber);margin-bottom:5px}
.planb-text{font-size:11.5px;color:#fcd34d;line-height:1.6;overflow-wrap:anywhere}
.planbp{margin-top:8px;background:rgba(244,63,94,.06);border:1px solid rgba(244,63,94,.2);border-radius:10px;overflow:hidden}
.planbp summary{padding:11px 12px;font-size:11.5px;font-weight:700;color:#fda4af;cursor:pointer;display:flex;align-items:center;gap:7px;min-height:44px}
.planbp summary::after{content:"▾";margin-left:auto;transition:transform .2s}
.planbp[open] summary::after{transform:rotate(180deg)}
.planbp-body{padding:0 12px 12px;font-size:11.5px;color:#fecdd3;line-height:1.65;overflow-wrap:anywhere}

/* Reservations block */
.resa{margin-bottom:16px;background:rgba(244,63,94,.06);border:1px solid rgba(244,63,94,.25);border-radius:12px;overflow:hidden}
.resa summary{padding:12px 14px;font-size:12.5px;font-weight:700;color:#fda4af;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px}
.resa summary::after{content:"▾";margin-left:auto;transition:transform .2s}
.resa[open] summary::after{transform:rotate(180deg)}
.resa-body{padding:0 10px 10px}
.resa-item{display:flex;gap:2px;align-items:flex-start;border-top:1px solid rgba(244,63,94,.15)}
.resa-body .resa-item:first-child{border-top:none}
.resa-txt{flex:1;min-width:0;padding:10px 8px 10px 2px}
.resa-n{font-size:12.5px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.resa-item.done .resa-n{text-decoration:line-through;color:var(--text3)}
.resa-d{font-size:11px;color:var(--text2);line-height:1.55;margin-top:3px;overflow-wrap:anywhere}

/* Reference cards */
.ref{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.ref-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.ref p{font-size:11.5px;color:var(--text2);line-height:1.65;margin-bottom:8px;overflow-wrap:anywhere}
.ref p:last-child{margin-bottom:0}
.ref strong{color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.kv:last-child{border-bottom:none}
.kv-k{color:var(--text2);min-width:0;overflow-wrap:anywhere}
.kv-v{color:var(--text);font-weight:600;font-family:ui-monospace,monospace;white-space:nowrap;flex-shrink:0}
.kv-v.big{color:var(--amber)}
.kv.total{border-top:1px solid var(--border2);margin-top:4px;padding-top:9px}
.phrase{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.phrase:last-child{border-bottom:none}
.phrase-fr{color:var(--text2);font-size:11px}
.phrase-vn{color:var(--text);font-weight:600}
.phrase-pr{color:var(--text3);font-size:10.5px;font-style:italic}
.tip-box{margin-top:14px;padding:10px 12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:8px;font-size:11px;color:#fcd34d;line-height:1.55}
.tip-box strong{color:var(--amber)}
.empty{padding:26px 14px;text-align:center;color:var(--text3);font-size:12px;line-height:1.6}

/* Migration banner */
.migbar{margin:0 14px 14px;padding:11px 12px;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);border-radius:10px;font-size:11.5px;color:#bfdbfe;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.migbar button{flex-shrink:0;min-width:44px;min-height:36px;font-size:16px;color:#93c5fd}

/* Carte chauffeur — volontairement noir sur blanc : cet écran se montre à un
   inconnu, souvent en plein soleil, et le thème sombre y est illisible. */
.drv-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--amber);font-weight:600;min-height:32px;padding:4px 0}
.drv{position:fixed;inset:0;z-index:60;background:#fff;color:#000;display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.drv-ask{font-size:17px;font-weight:600;color:#333;line-height:1.4;padding-bottom:14px;border-bottom:2px solid #000}
.drv-name{font-size:30px;font-weight:800;line-height:1.2;margin-top:22px;overflow-wrap:anywhere}
.drv-addr{font-size:26px;font-weight:600;line-height:1.35;margin-top:14px;overflow-wrap:anywhere}
.drv-city{font-size:22px;font-weight:600;color:#444;margin-top:10px}
.drv-thanks{font-size:20px;color:#333;margin-top:24px}
.drv-note{margin-top:auto;padding-top:22px;font-size:12px;color:#666;line-height:1.5}
.drv-close{margin-top:16px;width:100%;min-height:52px;background:#000;color:#fff;border-radius:12px;font-size:15px;font-weight:700}
@media (min-width:640px){ .drv-name{font-size:38px} .drv-addr{font-size:32px} }

.reset-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));right:14px;min-height:44px;padding:10px 15px;background:var(--card);border:1px solid var(--border2);border-radius:22px;font-size:11.5px;color:var(--text2);box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:20;display:flex;align-items:center;gap:6px;font-weight:600}

@media (min-width:640px){
  body{font-size:15px}
  .content{padding:20px 20px 90px}
  .day-city{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<button class="reset-btn" id="resetBtn">↻ Reset</button>

<script>
"use strict";

/* =========================================================================
   VIETNAM 13 JOURS — 18 → 30 août 2026
   Hanoi → Saigon → Ben Tre → Saigon → Da Nang → Hoi An → Hué → 🌙 → Hanoi
   Fichier autonome, zéro dépendance externe, fonctionne en mode avion.
   ========================================================================= */

const TRIP_START = "2026-08-18";  // jour 1
const TRIP_END   = "2026-08-30";  // jour 13

/* Les 7 réservations, par ordre d'urgence (§8) */
const RESAS = [
  { id:"train", t:"Couchette Hué → Hanoi, nuit du 28/08",

  { id:"assurance", t:"Assurance Revolut Ultra : couverture rapatriement et scooter",

];

const TRIP = [
{
  n:1, date:"Mar 18 août", code:"HAN", city:"Hanoi", title:"Atterrissage",
  line:"On ne force rien : SIM, cash, le lac, le vieux quartier, et au lit tôt.",
  intensity:1, weather:"32 °C · averses possibles",
  transport:{ icon:"✈️", text:"Arrivée vol international à Nội Bài. Grab ~350 000 VND / 45 min, ou bus express 86 à 45 000 VND par personne." },
  hotelsCity:"Hanoi", hotelsNights:"nuits du 18, 29 et 30 août",
  hotels:{
    insta:{ name:"Peridot Grand Luxury Boutique Hotel", addr:"33 Đường Thành", price:"70–95 €",
      why:"4,8/5 sur plus de 1 500 avis. Piscine, jacuzzi, bar en rooftop, hall classique très photogénique. Le spa est réputé pour son rapport qualité-prix." },
    eco:{ name:"Hanoi Old Quarter Hotel", addr:"23 Ngõ Hàng Hành", price:"40–55 €",
      why:"4,7/5. Dans une ruelle calme à deux pas du lac. L'ascenseur s'arrête au 6ᵉ : monte à pied au 7ᵉ, la vue sur Hoàn Kiếm y est meilleure que dans bien des hôtels deux fois plus chers." },
    budget:{ name:"A25 Hotel — vieux quartier", addr:"19 Chả Cá · 15 Hàng Than · 57 Quang Trung", price:"18–25 €",
      why:"Chaîne vietnamienne de 2-3 étoiles avec une dizaine d'adresses rien qu'à Hanoi, dont plusieurs dans le vieux quartier. C'est propre, climatisé, sans charme, et c'est exactement ce qu'on demande à 20 €. L'intérêt de la chaîne : si une adresse est pleine, la suivante est à 300 m. Replis à noter : Golden Rooster Hotel, Hanoi Inner Hotel (19 Âu Triệu)." },
    secret:{ name:"Dong Xuan Boutique Hotel", addr:"68 Nguyễn Thiếp", price:"45–60 €",
      why:"4,9/5 mais seulement ~200 avis : quasi inconnu des circuits. Chambres spacieuses, surclassements fréquents, à côté du marché Đồng Xuân donc au nord du vieux quartier, plus calme le soir." }

  hotelSafe:"Autres valeurs sûres si complet : Solaria Tesori (4,9), CLASSYC (4,9), GM Premium (4,9), Soleil Boutique (4,8, piscine en rooftop).",

      { t:"Lac Hoàn Kiếm + pagode Ngọc Sơn", n:"Promenade au cœur du vieux quartier, pagode sur îlot via le pont rouge Thê Húc. Le meilleur moment est le coucher de soleil, qui tombe vers 18 h 20 en août.", p:"30 000 VND", m:"Đền Ngọc Sơn Hà Nội" },
      { t:"Vieux quartier des 36 corporations", n:"Chaque rue portait un métier : Hàng Bạc l'argent, Hàng Gai la soie, Hàng Bông le coton. Deux ou trois heures à s'y perdre, sans itinéraire.", m:"Old Quarter Hanoi" },
      { t:"Train Street via un café licencié", n:"Accès libre interdit depuis 2023. Il faut consommer dans un café référencé (Railway Cafe, Track 5) qui te fait entrer. Réserve dans la journée, le train passe vers 19 h.", p:"~50 000 VND la conso", m:"Hanoi Train Street Railway Cafe" }

      { t:"Chả Cá Thăng Long", n:"Poisson au curcuma et à l'aneth, recette de 1871, cuit à table. Cent pour cent poisson, donc sans difficulté.", p:"~10 €", halal:"option", m:"Cha Ca Thang Long Duong Thanh Hanoi", rain:true },

      { t:"Cơm chay du vieux quartier", n:"La gargote végétarienne bouddhiste est la solution pas chère et sans risque au Vietnam : tout est sans viande, donc aucune question à poser sur le porc. On désigne trois plats du doigt, on paie au poids. Cherche une enseigne « quán chay » ou « cơm chay ».", p:"~40 000 VND pour deux", halal:true, m:"quan com chay Hoan Kiem Ha Noi" }

      { t:"Rue Hà Trung — or et change", n:"La rue des tiệm vàng, les boutiques d'or. Double intérêt : c'est là qu'on achète l'or au poids, et c'est aussi là que les euros en espèces se changent au meilleur taux de la ville, nettement mieux qu'en banque ou à l'hôtel. Compte les billets devant le comptoir avant de partir.", m:"Ha Trung street gold exchange Hanoi" },
      { t:"PNJ — or certifié, prix fixes", n:"La grande chaîne nationale. Or 18 et 24 carats, poinçon, facture, prix au poids du jour affiché au mur. Aucun marchandage, aucune mauvaise surprise : c'est la façon sûre d'acheter de l'or au Vietnam quand on n'y connaît rien.", m:"PNJ jewelry Hang Trong Hanoi" },

      { t:"Hải Triều — concessionnaire officiel", n:"Seiko, Citizen, Casio neuves avec garantie internationale. Prix fixes affichés. Si tu veux du neuf sans risque, c'est ici et nulle part ailleurs.", m:"Hai Trieu Watch Dinh Tien Hoang Hanoi" },
      { t:"Metiseko — soie et coton bio", n:"Marque franco-vietnamienne, imprimés dessinés maison, fabriqué au Vietnam. Le meilleur rapport qualité-prix en cadeau qui ne fait pas souvenir d'aéroport.", p:"30–100 €", m:"Metiseko Hang Gai Hanoi" },
      { t:"Ginkgo — t-shirts à motifs vietnamiens", n:"Coton épais, sérigraphies originales (calligraphie, scènes de Hanoi). Aucune contrefaçon, des dessins maison.", p:"15–25 €", m:"Ginkgo Concept Store Hang Gai Hanoi" }

    { title:"Bonus", items:[

      { t:"Provisions halal à faire à Saigon avant de partir", n:"Dernière vraie occasion avant Da Nang. Rue Đông Du : conserves, snacks, dattes. Prends pour trois jours.", halal:true, m:"Dong Du street Saigon halal food" },
      { t:"Sampan dans les petits canaux en fin de journée", n:"Barque étroite sous la voûte des palmiers d'eau, une heure. C'est le premier contact avec le rythme du delta et c'est le bon moment : lumière basse, chaleur tombée.", p:"~200 000 VND" },

/* ============================ ÉTAT ============================ */

const STORE = "vn-trip-2026-v2";
const OLD_STORE = "vn-trip-2026";
const MIG_FLAG = "vn-trip-2026-migrated";

let memoryOnly = false;
let migrationReport = null;

let state = { activeDay: 1, checked: {}, filter: "all", showRef: false };

function storageGet(k){ try { return localStorage.getItem(k); } catch(e){ memoryOnly = true; return null; } }
function storageSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ memoryOnly = true; return false; } }

function save(){
  if (!storageSet(STORE, JSON.stringify(state.checked))) memoryOnly = true;
}

function slug(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,44);
}

function itemKey(dayN, title){ return "d" + dayN + ":" + slug(title); }

/* Toutes les cases cochables du voyage, à plat */
function allKeys(){
  const out = [];
  RESAS.forEach(r => out.push("resa:" + r.id));
  TRIP.forEach(d => {
    (d.groups||[]).forEach(g => (g.items||[]).forEach(it => out.push(itemKey(d.n, it.t))));
    if (d.hotels) Object.keys(d.hotels).forEach(k => out.push("d"+d.n+":hotel:"+slug(d.hotels[k].name)));
    if (d.hotelTodo) out.push(itemKey(d.n, d.hotelTodo.t));
  });
  return out;
}

/* Index titre normalisé → nouvelle clé, pour la migration */
function titleIndex(){
  const idx = {};
  TRIP.forEach(d => {
    (d.groups||[]).forEach(g => (g.items||[]).forEach(it => { idx[norm(it.t)] = itemKey(d.n, it.t); }));
    if (d.hotels) Object.keys(d.hotels).forEach(k => { idx[norm(d.hotels[k].name)] = "d"+d.n+":hotel:"+slug(d.hotels[k].name); });
  });
  return idx;
}
function norm(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
}

function loadState(){
  const raw = storageGet(STORE);
  if (raw) { try { state.checked = JSON.parse(raw) || {}; } catch(e){ state.checked = {}; } }

  if (storageGet(MIG_FLAG)) return;

  // Première ouverture de la v2 : on tente de récupérer les coches de l'ancienne app.
  const oldRaw = storageGet(OLD_STORE);
  if (!oldRaw) { storageSet(MIG_FLAG, "1"); return; }
  let oldChecked = {};
  try { oldChecked = JSON.parse(oldRaw) || {}; } catch(e){ oldChecked = {}; }

  const idx = titleIndex();
  let moved = 0, lost = 0;
  Object.keys(oldChecked).forEach(k => {
    if (!oldChecked[k]) return;
    const oldTitle = LEGACY_MAP[k];
    const target = oldTitle ? idx[norm(oldTitle)] : null;
    if (target) { state.checked[target] = true; moved++; }
    else lost++;
  });
  if (moved || lost) {
    save();
    migrationReport = { moved, lost };
  }
  storageSet(MIG_FLAG, "1");
}

/* ============================ DATES ============================ */

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function isoOfDay(n){
  const base = new Date(TRIP_START + "T12:00:00");
  base.setDate(base.getDate() + (n-1));
  const p = x => String(x).padStart(2,"0");
  return base.getFullYear() + "-" + p(base.getMonth()+1) + "-" + p(base.getDate());
}
function todayDayNumber(){
  const t = todayISO();
  for (let i=1;i<=TRIP.length;i++) if (isoOfDay(i) === t) return i;
  return null;
}
function daysUntilStart(){
  const a = new Date(todayISO() + "T12:00:00"), b = new Date(TRIP_START + "T12:00:00");
  return Math.round((b - a) / 86400000);
}

/* ============================ STATS ============================ */

function dayItems(d){
  const out = [];
  (d.groups||[]).forEach(g => (g.items||[]).forEach(it => out.push({ it, key: itemKey(d.n, it.t) })));
  if (d.hotels) Object.keys(d.hotels).forEach(k => out.push({ it:{ t:d.hotels[k].name }, key:"d"+d.n+":hotel:"+slug(d.hotels[k].name) }));
  if (d.hotelTodo) out.push({ it:d.hotelTodo, key: itemKey(d.n, d.hotelTodo.t) });
  return out;
}
function dayStats(d){
  const items = dayItems(d);
  let done = 0;
  items.forEach(x => { if (state.checked[x.key]) done++; });
  return { done, total: items.length };
}
function totalStats(){
  let done = 0, total = 0;
  RESAS.forEach(r => { total++; if (state.checked["resa:"+r.id]) done++; });
  TRIP.forEach(d => { const s = dayStats(d); done += s.done; total += s.total; });
  return { done, total, pct: total ? (done/total*100) : 0 };
}

  if (s === undefined || s === null) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function passFilter(it){
  if (state.filter === "urgent") return !!it.urgent;
  if (state.filter === "halal")  return it.halal !== undefined && it.halal !== false;
  if (state.filter === "rain")   return !!it.rain;
  return true;
}
function passDone(key){
  if (state.filter === "todo") return !state.checked[key];
  return true;
}

function tagsFor(it){
  const t = [];
  if (it.urgent) t.push('<span class="tag tag-urgent">À RÉSERVER</span>');
  if (it.halal === true) t.push('<span class="tag tag-halal">HALAL ✓</span>');
  else if (it.halal === "option") t.push('<span class="tag tag-halal-option">DEMANDER</span>');
  if (it.rain) t.push('<span class="tag tag-rain">☔ OK</span>');
  return t.length ? '<div class="item-tags">' + t.join("") + "</div>" : "";
}

function renderItem(it, key){
  const done = !!state.checked[key];
  return '<div class="item ' + (done?"done":"") + '">'
    + '<div class="item-row">'
    + '<button class="check-hit" data-key="' + esc(key) + '" aria-pressed="' + done + '" aria-label="Cocher : ' + esc(it.t) + '">'
    + '<span class="checkbox ' + (done?"done":"") + '">' + (done?"✓":"") + '</span></button>'
    + '<div class="item-body">'
    + '<div class="item-head"><div class="item-title">' + esc(it.t) + '</div>' + tagsFor(it) + '</div>'
    + (it.n ? '<p class="item-desc">' + esc(it.n) + '</p>' : "")
    + '<div class="item-footer">'
    + '<span style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
    + (it.m ? '<a class="maps-link" href="' + mapsUrl(it.m) + '" target="_blank" rel="noopener">📍 Maps</a>' : "")

function renderIntensity(lv){
  let dots = "";
  for (let i=1;i<=5;i++) dots += '<span class="dot ' + (i<=lv?"on":"") + '"></span>';
  const labels = {1:"Très calme",2:"Calme",3:"Soutenu",4:"Dense",5:"Très dense"};
  return '<span class="intensity lv' + lv + '"><span class="dots">' + dots + '</span>'
    + '<span class="intensity-label">' + labels[lv] + '</span></span>';
}

function renderDay(d){
  let html = '<div class="day-header">'
    + '<div class="day-title"><div class="day-city">' + esc(d.city) + '</div><div class="day-date">' + esc(d.date) + '</div></div>'

    + '<div class="day-meta">' + renderIntensity(d.intensity) + '<span>☁️ ' + esc(d.weather) + '</span></div>';
  if (d.transport) html += '<div class="transport"><span>' + d.transport.icon + '</span><span>' + esc(d.transport.text) + '</span></div>';
  if (d.blockWarn) html += '<div class="alert alert-warn">⚠️ ' + esc(d.blockWarn) + '</div>';
  if (d.blockInfo) html += '<div class="alert alert-info">🛋️ ' + esc(d.blockInfo) + '</div>';
  if (d.trainNote) html += '<div class="alert alert-train">🌙 ' + esc(d.trainNote) + '</div>';
  if (d.peakAlert) html += '<div class="alert alert-peak">🎌 Fête nationale du 29 août au 2 septembre : foule, hôtels pleins, transports saturés, Grab difficile à trouver.</div>';
  html += '</div>';

  let shown = 0;
  (d.groups||[]).forEach(g => {
    const visible = (g.items||[]).map(it => ({ it, key: itemKey(d.n, it.t) }))
      .filter(x => passFilter(x.it) && passDone(x.key));
    if (!visible.length) return;
    shown += visible.length;
    const icons = { "Faire":"🎯", "Manger":"🍜", "Acheter":"🛍️", "Bonus":"💎", "Avant de dormir":"🌙", "Provisions pour 13 h de train":"🎒" };
    html += '<div class="section"><div class="section-header"><span class="section-icon">'
      + (icons[g.title] || "🎯") + '</span><span class="section-title">' + esc(g.title) + '</span>'
      + '<span class="section-count">' + visible.filter(x => state.checked[x.key]).length + '/' + (g.items||[]).length + '</span></div>'
      + '<div class="items">' + visible.map(x => renderItem(x.it, x.key)).join("") + '</div></div>';
  });

  if (d.schedule && state.filter === "all") html += renderSchedule(d.schedule);
  if (d.hotels && (state.filter === "all" || state.filter === "todo")) html += renderHotels(d);

  if (!shown && state.filter !== "all") {
    html += '<div class="empty">Rien ne correspond à ce filtre pour le jour ' + d.n + '.<br>Change de filtre ou de journée.</div>';
  }

  if (state.filter === "all") {
    html += '<div class="planb"><div class="planb-title">Plan B — ça tourne mal côté météo</div>'
      + '<div class="planb-text">' + esc(d.planB) + '</div></div>'
      + '<details class="planbp"><summary>Si ça part vraiment de travers</summary>'
      + '<div class="planbp-body">' + esc(d.planBp) + '</div></details>';
  }
  return html;
}

function phrase(fr,vn,pr){
  return '<div class="phrase"><div class="phrase-fr">' + esc(fr) + '</div>'
    + '<div class="phrase-vn">' + esc(vn) + ' <span class="phrase-pr">· ' + esc(pr) + '</span></div></div>';
}
function kv(k,v){
  return '<div class="kv"><span class="kv-k">' + esc(k) + '</span><span class="kv-v">' + esc(v) + '</span></div>';
}

/* ============================ VUE ============================ */

function render(){
  DRV = [];                 // les index data-drv sont recalculés à chaque rendu
  const stats = totalStats();
  const today = todayDayNumber();
  const until = daysUntilStart();

  const filters = [
    ["all","Tout"], ["urgent","À réserver"], ["halal","Halal"],
    ["rain","☔ Sous la pluie"], ["todo","Reste à faire"], ["today","Aujourd'hui"]
  ];

  let sub = "18 août → 30 août 2026 · 13 jours · couple";
  if (until > 0) sub = "J-" + until + " avant le départ · 18 → 30 août 2026";
  else if (today) sub = "Jour " + today + " sur 13 · en voyage";
  else if (until < 0) sub = "Voyage terminé · 18 → 30 août 2026";

  let html = '<div class="header">'
    + '<div class="header-top"><div>'
    + '<div class="header-title">🇻🇳 Vietnam 13j</div>'
    + '<div class="header-date">' + esc(sub) + '</div></div>'
    + '<div class="header-stats"><div class="header-counter">' + stats.done + '/' + stats.total + '</div>'
    + '<div class="header-label">fait</div></div></div>'
    + '<div class="progress-bar"><div class="progress-fill" style="width:' + stats.pct + '%"></div></div>'
    + '<div class="filters">'
    + filters.map(f => '<button class="filter ' + (state.filter === f[0] ? "on" : "") + '" data-filter="' + f[0] + '">' + esc(f[1]) + '</button>').join("")
    + '</div><div class="tabs">'
    + TRIP.map(d => {
        const ds = dayStats(d);
        const cls = (!state.showRef && d.n === state.activeDay) ? "active" : (ds.total > 0 && ds.done === ds.total ? "done" : "");
        return '<button class="tab ' + cls + '" data-day="' + d.n + '">J' + d.n
          + (d.n === today ? '<span class="tab-dot" title="Aujourd\'hui"></span>' : "")
          + '<span class="tab-code">' + esc(d.code) + '</span></button>';
      }).join("")
    + '<button class="tab ' + (state.showRef ? "active" : "") + '" data-day="ref">Réf.<span class="tab-code">INFOS</span></button>'
    + '</div></div>';

  if (migrationReport) {
    html += '<div class="migbar"><div>'
      + (migrationReport.moved
          ? '<strong>' + migrationReport.moved + ' case' + (migrationReport.moved>1?"s":"") + ' récupérée' + (migrationReport.moved>1?"s":"") + '</strong> de l\'ancienne version. '
          : '<strong>Itinéraire refait.</strong> ')
      + (migrationReport.lost
          ? migrationReport.lost + ' ancienne' + (migrationReport.lost>1?"s":"") + ' coche' + (migrationReport.lost>1?"s":"")
            + (migrationReport.lost>1?' n\'ont':' n\'a') + ' pas d\'équivalent dans le nouvel itinéraire (Mui Ne, Da Lat, Ninh Binh et les adresses qui allaient avec) : '
            + (migrationReport.lost>1?'elles n\'ont':'elle n\'a') + ' pas été transférée' + (migrationReport.lost>1?"s":"") + '.'
          : "")
      + '</div><button id="migClose" aria-label="Fermer">×</button></div>';
  }
  if (memoryOnly) {
    html += '<div class="migbar" style="background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.35);color:#fdba74">'
      + '<div><strong>Attention :</strong> la sauvegarde locale est bloquée sur ce navigateur (mode privé ?). '
      + 'Les cases cochées disparaîtront au rechargement. Ouvre la page dans un onglet normal.</div></div>';
  }

  html += '<div class="content">';

  if (state.showRef) {
    html += renderRef();
  } else {
    html += renderResas();
    const day = TRIP.find(d => d.n === state.activeDay) || TRIP[0];
    html += renderDay(day);
  }

  html += '</div>';
  document.getElementById("app").innerHTML = html;
}

/* ============================ ÉVÉNEMENTS ============================ */

document.body.addEventListener("click", e => {
  if (e.target.closest(".drv-close")) { closeDriver(); return; }
  const drv = e.target.closest("[data-drv]");
  if (drv) { const c = DRV[parseInt(drv.getAttribute("data-drv"),10)]; if (c) openDriver(c); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDriver(); });

document.getElementById("app").addEventListener("click", e => {
  const check = e.target.closest("[data-key]");
  if (check) {
    const k = check.getAttribute("data-key");
    state.checked[k] = !state.checked[k];
    if (!state.checked[k]) delete state.checked[k];
    save();
    const open = document.querySelector("details.resa[open]") ? true : false;
    render();
    if (open) { const el = document.querySelector("details.resa"); if (el) el.open = true; }
    return;
  }
  const f = e.target.closest("[data-filter]");
  if (f) {
    const v = f.getAttribute("data-filter");
    if (v === "today") {
      const t = todayDayNumber();
      state.filter = "all";
      state.showRef = false;
      if (t) { state.activeDay = t; }
      else {
        const u = daysUntilStart();
        alert(u > 0
          ? "Le voyage commence dans " + u + " jour" + (u>1?"s":"") + ", le 18 août 2026."
          : "Le voyage est terminé. Bon retour.");
      }
    } else {
      state.filter = v;
      state.showRef = false;
    }
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const d = e.target.closest("[data-day]");
  if (d) {
    const v = d.getAttribute("data-day");
    if (v === "ref") state.showRef = true;
    else { state.showRef = false; state.activeDay = parseInt(v,10); }
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (e.target.id === "migClose") { migrationReport = null; render(); }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Réinitialiser toutes les cases cochées ?\n\nCela efface la progression des 13 journées et des 7 réservations. Action irréversible.")) {
    state.checked = {};
    save();
    render();
  }
});

/* ==================== HORS LIGNE (service worker) ====================
   Sans ça, taper l'icône de l'écran d'accueil en mode avion donne une page
   blanche : le navigateur va rechercher le fichier sur le réseau. Le service
   worker garde une copie locale et sert la page sans connexion. */

let offlineState = "unsupported";   // unsupported | pending | ready | local

function refreshOfflineBadge(){
  const el = document.getElementById("offlineBadge");
  if (el) el.outerHTML = offlineBadgeHtml();
}
function offlineBadgeHtml(){
  const map = {
    ready:      ["#6ee7b7", "rgba(52,211,153,.12)", "rgba(52,211,153,.3)",
                 "Hors ligne : prêt ✓", "L'app est enregistrée sur ce téléphone. Elle s'ouvrira en mode avion, sans réseau."],
    pending:    ["#fcd34d", "rgba(251,191,36,.1)", "rgba(251,191,36,.3)",
                 "Hors ligne : en cours…", "Enregistrement en cours. Recharge la page une fois, encore connecté, pour terminer."],
    local:      ["#93c5fd", "rgba(96,165,250,.1)", "rgba(96,165,250,.3)",
                 "Fichier local", "La page est ouverte depuis un fichier : elle fonctionne déjà sans réseau."],
    unsupported:["#fdba74", "rgba(251,146,60,.1)", "rgba(251,146,60,.3)",
                 "Hors ligne : non garanti", "Ce navigateur ne gère pas la mise en cache hors ligne. Ouvre le lien dans Safari ou Chrome, pas dans un navigateur intégré à une app."]
  };
  const m = map[offlineState] || map.unsupported;
  return '<div id="offlineBadge" class="ref" style="color:' + m[0] + ';background:' + m[1] + ';border-color:' + m[2] + '">'
    + '<div class="ref-title" style="color:' + m[0] + '">📶 ' + esc(m[3]) + '</div>'
    + '<p style="color:' + m[0] + '">' + esc(m[4]) + '</p>'
    + '<p style="color:' + m[0] + '"><strong>À faire avant le départ :</strong> ouvre cette page une fois avec du réseau et vérifie que cette ligne affiche « prêt ». Ensuite, mets le téléphone en mode avion et rouvre l\'icône pour t\'en assurer toi-même.</p>'
    + '</div>';
}

function initOffline(){
  if (location.protocol === "file:") { offlineState = "local"; return; }
  if (!("serviceWorker" in navigator)) { offlineState = "unsupported"; return; }

  offlineState = navigator.serviceWorker.controller ? "ready" : "pending";

  navigator.serviceWorker.register("./sw.js").then(reg => {
    if (navigator.serviceWorker.controller) { offlineState = "ready"; refreshOfflineBadge(); }

    // une nouvelle version a été déployée pendant que l'app tournait
    reg.addEventListener("updatefound", () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener("statechange", () => {
        if (sw.state === "installed") {
          if (navigator.serviceWorker.controller) showUpdateBar();
          else { offlineState = "ready"; refreshOfflineBadge(); }
        }
      });
    });
  }).catch(() => { offlineState = "unsupported"; refreshOfflineBadge(); });

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    offlineState = "ready";
    refreshOfflineBadge();
  });
}

function showUpdateBar(){
  if (document.getElementById("updBar")) return;
  const bar = document.createElement("div");
  bar.id = "updBar";
  bar.className = "migbar";
  bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;z-index:40;"
    + "padding-bottom:calc(11px + env(safe-area-inset-bottom))";
  bar.innerHTML = '<div>Une version mise à jour de l\'itinéraire est disponible.</div>'
    + '<button id="updBtn" style="font-size:12px;font-weight:700;padding:0 10px">Recharger</button>';
  document.body.appendChild(bar);
  document.getElementById("updBtn").addEventListener("click", () => location.reload());
}

/* ============================ DÉMARRAGE ============================ */

initOffline();
loadState();
const t = todayDayNumber();
state.activeDay = t || 1;
render();
</script>
